<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D.A Sport  | Dariel Alcivar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff;
            --primary-glow: rgba(0, 210, 255, 0.4);
            --dark: #0f172a;
            --card: #1e293b;
            --accent: #334155;
            --light: #f8fafc;
            --whatsapp: #25d366;
            --glass: rgba(15, 23, 42, 0.9);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--dark); color: var(--light); overflow-x: hidden; scroll-behavior: smooth; }

        /* --- HEADER --- */
        header {
            height: 480px;
            background: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.95)), 
                        url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1200') center/cover;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            border-bottom: 4px solid var(--primary);
        }

        .main-logo-svg { width: 170px; height: 170px; margin-bottom: 15px; filter: drop-shadow(0 0 15px var(--primary-glow)); }

        .brand-box {
            background: rgba(0, 0, 0, 0.5); padding: 15px 45px; border-radius: 15px;
            border-left: 5px solid var(--primary); border-right: 5px solid var(--primary);
            backdrop-filter: blur(10px);
        }
        .brand-box h1 { font-size: 2.6rem; font-weight: 900; letter-spacing: -1px; margin: 0; }
        .brand-box p { color: var(--primary); font-weight: bold; letter-spacing: 6px; text-transform: uppercase; font-size: 0.85rem; }

        /* --- UI --- */
        .cart-status {
            position: fixed; bottom: 30px; right: 30px; background: var(--primary); color: var(--dark);
            padding: 18px 30px; border-radius: 50px; font-weight: 900; z-index: 1000; cursor: pointer;
            box-shadow: 0 10px 30px var(--primary-glow); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .cart-status:hover { transform: scale(1.1); background: white; }

        .filter-nav {
            position: sticky; top: 0; background: var(--glass); padding: 20px;
            z-index: 900; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;
            backdrop-filter: blur(15px); border-bottom: 1px solid var(--accent);
        }
        .filter-btn {
            background: transparent; border: 10px solid var(--accent); color: var(--light);
            padding: 10px 28px; cursor: pointer; border-radius: 25px; transition: 0.3s; font-size: 0.8rem; font-weight: bold;
        }
        .filter-btn.active, .filter-btn:hover { background: var(--primary); color: var(--dark); border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }

        /* --- CATALOG GRID --- */
        .catalog {
            max-width: 1400px; margin: 30px auto; display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 50px; padding: 20px;
        }
        .product-card {
            background: var(--card); border-radius: 20px; overflow: hidden;
            transition: 0.4s; border: 1px solid var(--accent); display: flex; flex-direction: column;
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .product-card:hover { border-color: var(--primary); transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .img-holder { width: 100%; height: 260px; background-size: cover; background-position: center; transition: 0.5s; }
        .product-card:hover .img-holder { transform: scale(1.05); }
        
        .product-info { padding: 25px; flex-grow: 1; display: flex; flex-direction: column; }
        .product-info h3 { font-size: 1.1rem; margin-bottom: 35px; height: 50px; overflow: hidden; }
        .price { font-size: 1.7rem; font-weight: 900; color: var(--primary); margin-bottom: 15px; }

        .selectors { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        input {
            background: var(--dark); color: white; border: 1px solid var(--accent);
            padding: 12px; border-radius: 10px; font-size: 0.85rem; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 8px var(--primary-glow); }

        .btn-add {
            width: 100%; background: var(--primary); color: var(--dark); border: none;
            padding: 15px; font-weight: 900; border-radius: 12px; cursor: pointer; transition: 0.2s; text-transform: uppercase;
        }
        .btn-add:hover { background: white; letter-spacing: 1px; }

        /* --- MODAL --- */
        #checkout-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(10px);
        }
        .modal-content {
            background: var(--card); padding: 40px; border-radius: 25px; max-width: 500px; width: 90%;
            text-align: center; border: 2px solid var(--primary); box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
    </style>
</head>

        let cart = [];

        function render(filter = 'all') {
            const container = document.getElementById('catalog');
            container.innerHTML = '';
            const filtered = filter === 'all' ? products : products.filter(p => p.cat === filter);
            
            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                
                const tallaCampo = p.cat !== 'recuperacion' 
                    ? `<input type="text" id="size-${p.id}" placeholder="Talla (S, M, L, 40, 42...)">` 
                    : ``;

                card.innerHTML = `
                    <div class="img-holder" style="background-image: url('${p.img}')"></div>
                    <div class="product-info">
                        <h3>${p.name}</h3>
                        <div class="selectors">
                            ${tallaCampo}
                            <input type="text" id="color-${p.id}" placeholder="Color deseado">
                            <input type="number" id="qty-${p.id}" value="1" min="1">
                        </div>
                        <p class="price">$${p.price.toFixed(2)}</p>
                        <button class="btn-add" onclick="addToCart(${p.id}, this)">AGREGAR AL PEDIDO</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function addToCart(id, btn) {
            const p = products.find(prod => prod.id === id);
            const sizeInp = document.getElementById(`size-${id}`);
            const size = sizeInp ? sizeInp.value.trim() : "Única/NA";
            const color = document.getElementById(`color-${id}`).value.trim();
            const qty = parseInt(document.getElementById(`qty-${id}`).value);

            if((sizeInp && !size) || !color || qty < 1) {
                alert("Por favor, completa Talla y Color antes de agregar.");
                return;
            }

            cart.push({ ...p, selectedSize: size, selectedColor: color, quantity: qty, subtotal: p.price * qty });
            document.getElementById('cart-count').innerText = cart.length;
            
            btn.innerText = "¡OK! AÑADIDO";
            btn.style.background = "white";
            setTimeout(() => { btn.innerText = "AGREGAR AL PEDIDO"; btn.style.background = "var(--primary)"; }, 900);
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render(cat);
            window.scrollTo({ top: 450, behavior: 'smooth' });
        }

        function openCheckout() {
            if(cart.length === 0) return alert("Tu carrito está vacío.");
            const list = document.getElementById('cart-list');
            const total = cart.reduce((s, i) => s + i.subtotal, 0);
            
            list.innerHTML = cart.map(i => `
                <div style="border-bottom:1px solid #334155; padding: 12px 0;">
                    <b style="color:var(--primary)">${i.name}</b> x${i.quantity}<br>
                    <small>Talla: ${i.selectedSize} | Color: ${i.selectedColor}</small><br>
                    <span>Subtotal: $${i.subtotal.toFixed(2)}</span>
                </div>
            `).join('');

            document.getElementById('cart-total').innerText = `$${total.toFixed(2)}`;
            
            let msg = `*DA SPORT LAB - PEDIDO*%0A%0A`;
            cart.forEach(i => msg += `• ${i.name} (x${i.quantity})%0A  Talla: ${i.selectedSize} / Color: ${i.selectedColor}%0A%0A`);
            msg += `*TOTAL A PAGAR: $${total.toFixed(2)}*`;
            
            document.getElementById('wa-link').href = `https://wa.me/0968990523?text=${msg}`;
            document.getElementById('checkout-modal').style.display = 'flex';
        }

        function closeCheckout() { document.getElementById('checkout-modal').style.display = 'none'; }

        render();
    </script>
</body>
